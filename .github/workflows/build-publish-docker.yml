name: create and publish docker image
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      tag: 
        required: true
        type: string
    
    secrets:
      registery_username:
        required: true
      registery_password:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo code
        uses: actions/checkout@v4

      - name: login to docker registery
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.registery_username }}
          password: ${{ secrets.registery_password }}

      - name: set up tag
        run: |
          if [ -z "${{ inputs.tag }}" ]
          then
            echo "final_tag=latest" >> $GITHUB_ENV
          else
            echo "final_tag=${{ inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: build and push to docker hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.registery_username }}/${{ inputs.image-name }}:${{ env.final_tag }}
  
  do-something-else:
    runs-on: windows-latest
    steps:
      - run: echo "Hello"

      
  
